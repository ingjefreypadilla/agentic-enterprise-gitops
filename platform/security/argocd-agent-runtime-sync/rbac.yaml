apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-agent-runtime-sync
  namespace: agentic-lab
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
    app.kubernetes.io/component: gitops-sync
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-agent-runtime-sync
  namespace: agentic-lab
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
    app.kubernetes.io/component: gitops-sync
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-agent-runtime-sync
  namespace: agentic-lab
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
    app.kubernetes.io/component: gitops-sync
subjects:
  - kind: ServiceAccount
    name: argocd-agent-runtime-sync
    namespace: agentic-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-agent-runtime-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-agent-runtime-observer
  namespace: agentic-lab
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
    app.kubernetes.io/component: gitops-observer
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-agent-runtime-observer
  namespace: agentic-lab
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
    app.kubernetes.io/component: gitops-observer
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-agent-runtime-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-agent-runtime-impersonator
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
    app.kubernetes.io/component: gitops-sync
rules:
  - apiGroups:
      - ""
    resources:
      - users
    resourceNames:
      - system:serviceaccount:agentic-lab:argocd-agent-runtime-sync
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-agent-runtime-impersonator
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
    app.kubernetes.io/component: gitops-sync
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
  - kind: ServiceAccount
    name: argocd-server
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-agent-runtime-impersonator
